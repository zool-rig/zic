[project]
name = "zic"
version = "0.1.0"
description = "A local-library desktop music player with album/genre browsing and genre-aware smart playlists."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MF_ZOOL" }]
keywords = [
    # Read by the About dialog through importlib.metadata (see
    # zic.app.find_release_date): update it with each release.
    "release-date:2026-09-20",
    "music",
    "music-player",
    "audio",
    "mp3",
    "m4a",
    "playlist",
    "smart-playlist",
    "pyside6",
    "qt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Sound/Audio :: Players :: MP3",
]
dependencies = [
    "appdirs>=1.4.4",
    "pyside6>=6.11.2",
    "toml>=0.10.2",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "click>=8.5.0",
    "requests>=2.34.2",
    "secret-type>=0.3.0",
    "plotly>=7.1.0",
    "pandas>=3.0.6",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/zool-rig/zic"
Repository = "https://github.com/zool-rig/zic"
Issues = "https://github.com/zool-rig/zic/issues"

[build-system]
# 77+: SPDX `license` expression and `license-files` (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
zic = "zic.main:main"

[tool.setuptools.package-data]
zic = [
    "resources/**/*",
    "schema.sql"
]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
