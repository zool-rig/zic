[project]
name = "zic-ingestor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ingest = "zic_ingestor.ingest:main"
compute-genres = "zic_ingestor.compute_genre_positions:main"

[tool.setuptools.package-data]
zic_ingestor = [
    "schema.sql",
]
